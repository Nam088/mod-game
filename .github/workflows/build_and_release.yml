name: Auto Build & Release Game Mods

on:
  push:
    branches:
      - master
    paths:
      - "Oxygen-Not-Included/**"
      - "Timberborn/**"
      - "Against-The-Storm/**"
      - "WorldBox/**"
      - "!**/dist/**"
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      game:
        description: "Chọn Game cần build (hoặc \"all\" / \"auto\")"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - all
          - Oxygen-Not-Included
          - Timberborn
          - Against-The-Storm
          - WorldBox
      bump_version:
        description: "Tự động tăng Version (Patch)?"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Build Dependencies
        run: |
          pip install polib pandas openpyxl

      - name: Detect Changes & Build Mod ZIPs
        id: build_step
        run: |
          GAME_INPUT="${{ github.event.inputs.game || 'auto' }}"
          BUMP_FLAG=""
          if [ "${{ github.event.inputs.bump_version }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            BUMP_FLAG="--bump"
          fi
          python3 scripts/build_and_package_mods.py --game "$GAME_INPUT" $BUMP_FLAG --base-ref HEAD~1 --output-json build_results.json
          BUILD_COUNT=$(python3 -c "import json; print(len(json.load(open('build_results.json'))))")
          echo "build_count=$BUILD_COUNT" >> $GITHUB_OUTPUT

      - name: Commit & Push Updated Versions & Dist Files
        if: steps.build_step.outputs.build_count > 0
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if git diff --staged --quiet; then
            echo "Không có thay đổi metadata nào cần commit."
          else
            git commit -m "chore(release): Tự động cập nhật version và đóng gói ZIP bản phát hành mới [skip ci]"
            git push origin master
          fi

      - name: Create GitHub Releases & Upload ZIP Assets
        if: steps.build_step.outputs.build_count > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/publish_releases.py
